<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Toko Cerdas 3D — Warung Voxel Cozy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6ba7dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #toast-bubble {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(35, 23, 16, 0.92);
      color: #ffd166;
      border: 2px solid #c68a4c;
      padding: 8px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 0;
      z-index: 50;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #pickup-sparkle {
      position: absolute;
      pointer-events: none;
      display: none;
      font-size: 24px;
      z-index: 60;
      animation: sparklePop 0.6s ease-out forwards;
    }
    @keyframes sparklePop {
      0% { transform: scale(0.5) translate(0, 0); opacity: 1; }
      50% { transform: scale(1.4) translate(0, -25px); opacity: 1; }
      100% { transform: scale(0.8) translate(0, -45px); opacity: 0; }
    }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="toast-bubble">✨ Selamat Datang di Toko Cerdas 3D!</div>
  <div id="pickup-sparkle">✨</div>

  <script>
    // ==========================================
    // 1. WEB AUDIO SYNTHESIZER
    // ==========================================
    let audioCtx = null;
    let isAudioEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    window.playSfx = function(type) {
      if (!isAudioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'door_bell') {
          // Warm shop doorbell chime (ting-tong)
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // E5
          osc2.frequency.setValueAtTime(523.25, now + 0.18); // C5
          gain.gain.setValueAtTime(0.20, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.22);
          osc2.start(now + 0.18);
          osc2.stop(now + 0.9);
        } else if (type === 'item_click') {
          // Satisfying crisp item pickup pop
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'kaching') {
          // Cash register ring
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, now); // B5
          osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.65);
        } else if (type === 'coin') {
          // Cheerful coin clink
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1046.50, now); // C6
          osc.frequency.setValueAtTime(1396.91, now + 0.06); // F6
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'success') {
          // Success arpeggio (C - E - G - C)
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.2, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.35);
          });
        } else if (type === 'retry') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(392.00, now);
          osc.frequency.setValueAtTime(329.63, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch (e) {
        console.warn('Audio play error:', e);
      }
    };

    window.setAudioEnabled = function(enabled) {
      isAudioEnabled = enabled;
    };

    // ==========================================
    // 2. BRIDGE & TOAST
    // ==========================================
    function sendToFlutter(data) {
      const jsonStr = JSON.stringify(data);
      if (window.FlutterBridge && window.FlutterBridge.postMessage) {
        window.FlutterBridge.postMessage(jsonStr);
      } else if (window.parent && window.parent.postMessage) {
        window.parent.postMessage(jsonStr, '*');
      }
    }

    function showToast(text, durationMs = 2000) {
      const bubble = document.getElementById('toast-bubble');
      bubble.textContent = text;
      bubble.style.opacity = '1';
      bubble.style.transform = 'translateX(-50%) translateY(0px)';
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        bubble.style.opacity = '0';
        bubble.style.transform = 'translateX(-50%) translateY(-20px)';
      }, durationMs);
    }

    function triggerSparkle(x, y) {
      const sp = document.getElementById('pickup-sparkle');
      sp.style.left = x + 'px';
      sp.style.top = y + 'px';
      sp.style.display = 'block';
      sp.style.animation = 'none';
      sp.offsetHeight; // reflow
      sp.style.animation = 'sparklePop 0.6s ease-out forwards';
      setTimeout(() => { sp.style.display = 'none'; }, 600);
    }

    // ==========================================
    // 3. THREE.JS SCENE SETUP
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6ba7dc); // Sky blue matching reference image
    scene.fog = new THREE.FogExp2(0x8bc0ec, 0.015);

    // Camera placed exactly at shopkeeper's view behind wooden counter
    const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.25, 0.45);
    camera.lookAt(0, 1.15, -1.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // Warm, sunny daylight
    const ambientLight = new THREE.AmbientLight(0xfff6ea, 0.95);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaec, 1.1);
    sunLight.position.set(3, 8, 4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 25;
    sunLight.shadow.bias = -0.001;
    scene.add(sunLight);

    const counterFillLight = new THREE.PointLight(0xffecd2, 0.5, 6);
    counterFillLight.position.set(0, 1.8, 0);
    scene.add(counterFillLight);

    // ==========================================
    // 4. PROCEDURAL PIXEL-ART TEXTURE GENERATORS
    // ==========================================
    function createPixelTexture(w, h, drawFn) {
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      drawFn(ctx, w, h);
      const tex = new THREE.CanvasTexture(cv);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    // Warm Wood Texture with pixel boards
    function createWoodTexture(baseColor = '#a86532', darkColor = '#80481e', boardWidth = 32) {
      return createPixelTexture(128, 128, (ctx, w, h) => {
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = darkColor;
        for (let x = 0; x < w; x += boardWidth) {
          ctx.fillRect(x, 0, 2, h);
        }
        // Pixel wood grains
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        for (let y = 8; y < h; y += 16) {
          ctx.fillRect(0, y, w, 2);
          ctx.fillRect(10, y + 4, 30, 1);
          ctx.fillRect(70, y + 6, 25, 1);
        }
      });
    }

    // Keripik Bag Texture (Red with golden chips)
    function createKeripikTexture() {
      return createPixelTexture(128, 128, (ctx, w, h) => {
        ctx.fillStyle = '#d63031';
        ctx.fillRect(0, 0, w, h);
        // Top and bottom seal crimps
        ctx.fillStyle = '#b71515';
        ctx.fillRect(0, 0, w, 8);
        ctx.fillRect(0, h - 8, w, 8);
        // Yellow banner
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(12, 28, w - 24, 24);
        ctx.fillStyle = '#c0392b';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Keripik', w / 2, 45);
        // Potato chips pile
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(44, 82, 14, 0, Math.PI * 2);
        ctx.arc(70, 80, 16, 0, Math.PI * 2);
        ctx.arc(88, 86, 12, 0, Math.PI * 2);
        ctx.arc(58, 92, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(68, 78, 12, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Biskuit Package Texture (Blue with chocolate cookies)
    function createBiskuitTexture() {
      return createPixelTexture(128, 128, (ctx, w, h) => {
        ctx.fillStyle = '#1e6091';
        ctx.fillRect(0, 0, w, h);
        // Top & bottom seals
        ctx.fillStyle = '#184e77';
        ctx.fillRect(0, 0, w, 8);
        ctx.fillRect(0, h - 8, w, 8);
        // White Title
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Biskuit', w / 2, 40);
        // Chocolate chip cookies
        function drawCookie(cx, cy, r) {
          ctx.fillStyle = '#d4a373';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#6b4f34';
          ctx.beginPath();
          ctx.arc(cx - 4, cy - 3, 2.5, 0, Math.PI * 2);
          ctx.arc(cx + 4, cy - 2, 2.5, 0, Math.PI * 2);
          ctx.arc(cx, cy + 4, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        drawCookie(48, 80, 18);
        drawCookie(82, 85, 16);
      });
    }

    // Susu Carton Texture (Green with cute cow face)
    function createSusuTexture() {
      return createPixelTexture(128, 128, (ctx, w, h) => {
        // Green bottom
        ctx.fillStyle = '#40916c';
        ctx.fillRect(0, 48, w, h - 48);
        // White top
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, 48);
        // Text Susu
        ctx.fillStyle = '#1b4332';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Susu', w / 2, 34);
        // Cute smiling cow face
        const cx = w / 2;
        const cy = 84;
        // Cow head
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 26, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        // Cow spots
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(cx - 14, cy - 10, 8, 0, Math.PI * 2);
        ctx.fill();
        // Cow pink muzzle
        ctx.fillStyle = '#ffb4a2';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 8, 16, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // Nostrils
        ctx.fillStyle = '#e56b6f';
        ctx.fillRect(cx - 5, cy + 6, 3, 4);
        ctx.fillRect(cx + 2, cy + 6, 3, 4);
        // Eyes
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(cx - 10, cy - 4, 3, 0, Math.PI * 2);
        ctx.arc(cx + 10, cy - 4, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Indomie Cup Texture (White cup with red header & noodle graphic)
    function createIndomieTexture() {
      return createPixelTexture(128, 128, (ctx, w, h) => {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        // Red top band
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(0, 0, w, 32);
        // Red Indomie script
        ctx.fillStyle = '#ffffff';
        ctx.font = 'italic bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Indomie', w / 2, 23);
        // Steaming ramen bowl
        ctx.fillStyle = '#e67e22';
        ctx.beginPath();
        ctx.arc(w / 2, 85, 30, 0, Math.PI);
        ctx.fill();
        // Yellow noodles
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.ellipse(w / 2, 85, 28, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // Egg slice
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(w / 2 - 8, 83, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(w / 2 - 8, 83, 4, 0, Math.PI * 2);
        ctx.fill();
        // Green scallions
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(w / 2 + 8, 80, 4, 4);
        ctx.fillRect(w / 2 + 14, 84, 4, 4);
      });
    }

    // AQUA Bottle Label Texture
    function createAquaTexture() {
      return createPixelTexture(128, 64, (ctx, w, h) => {
        ctx.fillStyle = '#0077b6';
        ctx.fillRect(0, 0, w, h);
        // White mountain wave
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(20, h - 18);
        ctx.lineTo(40, h);
        ctx.lineTo(64, h - 22);
        ctx.lineTo(90, h);
        ctx.lineTo(110, h - 16);
        ctx.lineTo(w, h);
        ctx.fill();
        // AQUA bold text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('AQUA', w / 2, 28);
      });
    }

    // Price Tag Texture (Cream card with dark border)
    function createPriceTagTexture(priceText) {
      return createPixelTexture(128, 48, (ctx, w, h) => {
        ctx.fillStyle = '#fcf8ee';
        ctx.fillRect(0, 0, w, h);
        // Dark brown border
        ctx.strokeStyle = '#2b1b17';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, w - 4, h - 4);
        // Text
        ctx.fillStyle = '#2b1b17';
        ctx.font = 'bold 18px monospace, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(priceText, w / 2, h / 2);
      });
    }

    // Hanging Shop Board Texture
    function createSignboardTexture() {
      return createPixelTexture(256, 100, (ctx, w, h) => {
        ctx.fillStyle = '#7a431d';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#4e2a10';
        ctx.lineWidth = 6;
        ctx.strokeRect(3, 3, w - 6, h - 6);
        ctx.fillStyle = '#ffd166';
        ctx.font = 'bold 24px monospace, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('TOKO CERDAS', w / 2, h / 2);
      });
    }

    // Striped Awning Texture (Blue and White)
    function createAwningTexture() {
      return createPixelTexture(64, 64, (ctx, w, h) => {
        ctx.fillStyle = '#3498db';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w / 2, h);
      });
    }

    // Cobblestone Ground Texture
    function createCobblestoneTexture() {
      return createPixelTexture(128, 128, (ctx, w, h) => {
        ctx.fillStyle = '#b8b2a8';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#9b948a';
        for (let y = 0; y < h; y += 16) {
          const offset = (y / 16) % 2 === 0 ? 0 : 8;
          for (let x = -8; x < w; x += 16) {
            ctx.strokeRect(x + offset + 1, y + 1, 14, 14);
          }
        }
      });
    }

    // Speech Bubble Texture with Shopping Cart icon 🛒
    function createCartBubbleTexture() {
      return createPixelTexture(128, 96, (ctx, w, h) => {
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.clearRect(0, 0, w, h);
        // White rounded bubble box
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#2b1b17';
        ctx.lineWidth = 4;
        const bx = 8, by = 6, bw = 112, bh = 64, br = 12;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, br);
        ctx.fill();
        ctx.stroke();

        // Bubble pointer tail
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(w / 2 - 8, by + bh);
        ctx.lineTo(w / 2, by + bh + 14);
        ctx.lineTo(w / 2 + 8, by + bh);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Fix tail seam
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(w / 2 - 6, by + bh - 2, 12, 4);

        // Shopping cart pixel emoji/drawing
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🛒', w / 2, by + bh / 2 + 2);
      });
    }

    // Happy Speech Bubble Texture with Heart ❤️
    function createHappyBubbleTexture() {
      return createPixelTexture(128, 96, (ctx, w, h) => {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#2b1b17';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(8, 6, 112, 64, 12);
        ctx.fill();
        ctx.stroke();
        // Tail
        ctx.beginPath();
        ctx.moveTo(w / 2 - 8, 70);
        ctx.lineTo(w / 2, 84);
        ctx.lineTo(w / 2 + 8, 70);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(w / 2 - 6, 68, 12, 4);
        // Red heart
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('❤️', w / 2, 38);
      });
    }

    // Shared Wood Materials
    const woodTexture = createWoodTexture('#a86532', '#7e461e', 32);
    const darkWoodTexture = createWoodTexture('#633618', '#42220d', 16);
    const woodMaterial = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.7 });
    const darkWoodMaterial = new THREE.MeshStandardMaterial({ map: darkWoodTexture, roughness: 0.8 });

    // ==========================================
    // 5. WARUNG STRUCTURE (COUNTER, SHELVES, ROOF)
    // ==========================================
    const warungGroup = new THREE.Group();
    scene.add(warungGroup);

    // Counter Desk Top
    const counterDesk = new THREE.Mesh(
      new THREE.BoxGeometry(3.6, 0.08, 0.9),
      woodMaterial
    );
    counterDesk.position.set(0, 0.92, -0.35);
    counterDesk.receiveShadow = true;
    warungGroup.add(counterDesk);

    // Counter Desk Front Panel
    const counterFront = new THREE.Mesh(
      new THREE.BoxGeometry(3.6, 0.92, 0.06),
      darkWoodMaterial
    );
    counterFront.position.set(0, 0.46, -0.77);
    warungGroup.add(counterFront);

    // Counter Mat in Center (Clickable)
    const counterMat = new THREE.Mesh(
      new THREE.BoxGeometry(1.05, 0.015, 0.52),
      new THREE.MeshStandardMaterial({ color: 0x2b2d31, roughness: 0.85 })
    );
    counterMat.position.set(0, 0.965, -0.35);
    counterMat.userData = { isCashierTrigger: true };
    warungGroup.add(counterMat);

    // Cash Register POS on Left Counter
    const registerGroup = new THREE.Group();
    registerGroup.position.set(-0.85, 0.96, -0.38);
    // Base drawer
    const regBase = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.18, 0.48),
      new THREE.MeshStandardMaterial({ color: 0x24262a, roughness: 0.7 })
    );
    regBase.position.y = 0.09;
    registerGroup.add(regBase);
    // Monitor screen stand
    const regStand = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.16, 0.12),
      new THREE.MeshStandardMaterial({ color: 0x1d1e22 })
    );
    regStand.position.set(0, 0.26, -0.05);
    registerGroup.add(regStand);
    // Tilted Touch Screen Monitor
    const regScreen = new THREE.Mesh(
      new THREE.BoxGeometry(0.48, 0.32, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x181a1d, roughness: 0.5 })
    );
    regScreen.position.set(0, 0.36, -0.02);
    regScreen.rotation.x = -0.25;
    registerGroup.add(regScreen);
    // Screen display face

    // ==========================================
    // 9. RAYCASTING & TOUCH/CLICK INTERACTION
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : 0);
      const clientY = event.clientY || (event.touches && event.touches[0] ? event.touches[0].clientY : 0);

      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableItems, true);

      if (intersects.length > 0) {
        let hit = intersects[0].object;
        // Check for parent user data
        let target = hit;
        while (target && !target.userData.isProduct && !target.userData.isCashierTrigger && !target.userData.isCustomerTrigger && target.parent) {
          if (target.userData.parentGroup) {
            target = target.userData.parentGroup;
            break;
          }
          target = target.parent;
        }

        const uData = target.userData && (target.userData.isProduct || target.userData.isCashierTrigger || target.userData.isCustomerTrigger)
          ? target.userData
          : hit.userData;

        if (uData.isProduct) {
          // Play item pickup sound
          window.playSfx('item_click');
          triggerSparkle(clientX, clientY);
          showToast('📦 Mengambil ' + uData.name + ' (' + uData.productId + ')');

          // Cute pickup bounce animation
          const origY = hit.position.y;
          hit.position.y += 0.08;
          setTimeout(() => { hit.position.y = origY; }, 180);

          // Notify Flutter
          sendToFlutter({
            type: 'ITEM_CLICKED',
            productId: uData.productId
          });
        } else if (uData.isCashierTrigger) {
          window.playSfx('kaching');
          sendToFlutter({ type: 'CASHIER_ARRIVED' });
        } else if (uData.isCustomerTrigger) {
          sendToFlutter({ type: 'CUSTOMER_ARRIVED' });
        }
      }
    }

    window.addEventListener('pointerdown', onPointerDown);

    // ==========================================
    // 10. ANIMATION LOOP & FPS COUNTER
    // ==========================================
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Customer state animations
      if (customerState === 'WALKING_IN') {
        customerGroup.position.z += delta * 2.2;
        customerWalkProgress += delta * 10;
        custHead.position.y = 0.92 + Math.abs(Math.sin(customerWalkProgress)) * 0.03;
        custArmL.rotation.x = Math.sin(customerWalkProgress) * 0.4;
        custArmR.rotation.x = -Math.sin(customerWalkProgress) * 0.4;

        if (customerGroup.position.z >= -1.35) {
          customerGroup.position.z = -1.35;
          customerState = 'IDLE';
          custHead.position.y = 0.92;
          custArmL.rotation.x = 0;
          custArmR.rotation.x = 0;
          sendToFlutter({ type: 'CUSTOMER_ARRIVED' });
        }
      } else if (customerState === 'IDLE') {
        // Gentle breathing bob
        const breath = Math.sin(now * 0.003) * 0.012;
        custHead.position.y = 0.92 + breath;
        custTorso.position.y = 0.45 + breath * 0.6;
        // Speech bubble float & pop
        speechBubble.position.y = 1.52 + Math.sin(now * 0.004) * 0.025;
        if (speechBubble.scale.x < 1.0) {
          const s = Math.min(1.0, speechBubble.scale.x + delta * 6);
          speechBubble.scale.set(s, s, s);
        }
      } else if (customerState === 'HAPPY') {
        // Joyful hop
        const hop = Math.abs(Math.sin(now * 0.012)) * 0.12;
        customerGroup.position.y = 0.28 + hop;
        custArmL.rotation.z = -0.5 + Math.sin(now * 0.015) * 0.3;
        custArmR.rotation.z = 0.5 - Math.sin(now * 0.015) * 0.3;
      } else if (customerState === 'LEAVING') {
        customerGroup.position.z -= delta * 2.5;
        customerGroup.rotation.y = Math.PI; // turn around
        customerWalkProgress += delta * 10;
        custHead.position.y = 0.92 + Math.abs(Math.sin(customerWalkProgress)) * 0.03;

        if (customerGroup.position.z <= -4.0) {
          customerGroup.visible = false;
          customerGroup.rotation.y = 0;
          customerState = 'GONE';
          sendToFlutter({ type: 'CUSTOMER_GONE' });
        }
      }

      // Slowly drift clouds
      clouds.forEach(cloud => {
        cloud.position.x += delta * 0.2;
        if (cloud.position.x > 14) cloud.position.x = -14;
      });

      // Distant NPC idle
      distantNpc.rotation.y = Math.sin(now * 0.001) * 0.2;

      renderer.render(scene, camera);

      // FPS tracking
      frameCount++;
      if (now - lastFpsUpdate >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
        sendToFlutter({ type: 'FPS_UPDATE', fps: fps });
        frameCount = 0;
        lastFpsUpdate = now;
      }
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Notify Flutter that 3D scene is ready
    setTimeout(() => {
      sendToFlutter({ type: 'SCENE_READY' });
      requestAnimationFrame(animate);
    }, 100);
  </script>
</body>
</html>
